# Builds the Docker image and pushes it to Docker Hub (shanisma/pnex-coolprop-rs).
#
# Tagging rules (via docker/metadata-action):
#   push to any branch  -> :<branch-name>          (e.g. :main, :feat-docker)
#   push to main        -> :main + :latest
#   push of a git tag   -> :<tag-name>             (e.g. :v1.0.0)
#
# Credentials (organization-level so other repos can reuse them):
#   DOCKER_TOKEN   secret   (Docker Hub -> Account Settings ->
#                          Personal access tokens, Read/Write scope)
#   DOCKER_USERNAME  variable or secret (non-sensitive either way)
# Configured under: Pnex org -> Settings -> Secrets and variables -> Actions.
# Each org secret's access must be "All repositories" or include this repo.
name: Docker

on:
  push:
    branches: ["**"]
    tags: ["**"]

env:
  REGISTRY_IMAGE: shanisma/pnex-coolprop-rs

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # nothing here pushes to git; keep the token out of .git/config

      # Fail fast with a clear message instead of the cryptic
      # "Username and password required" from login-action. Deliberately a
      # plain shell test on env-mapped secrets (the docs-canonical pattern):
      # piping toJSON(secrets) into a script trips GitHub's
      # malicious-workflow detector and forces manual approval every run.
      - name: Check Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Docker Hub credentials not visible to this workflow. DOCKER_TOKEN/DOCKER_USERNAME live at the Pnex org level (org Settings -> Secrets and variables -> Actions); each item's access policy must be 'All repositories' or list Pnex/pnex-coolprop-rs."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # branch -> branch name, main also gets latest, git tag -> tag name
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Add linux/arm64 here for multi-arch (slower build under QEMU).
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
