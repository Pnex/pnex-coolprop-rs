# Builds the Docker image and pushes it to Docker Hub (shanisma/pnex-coolprop-rs).
#
# Tagging rules (via docker/metadata-action):
#   push to any branch  -> :<branch-name>          (e.g. :main, :feat-docker)
#   push to main        -> :main + :latest
#   push of a git tag   -> :<tag-name>             (e.g. :v1.0.0)
#
# Credentials:
#   DOCKER_TOKEN   repository secret  (Docker Hub -> Account Settings ->
#                                    Personal access tokens, Read/Write scope)
#   DOCKER_USERNAME  repository variable OR secret (non-sensitive either way)
# Set both under: Settings -> Secrets and variables -> Actions
name: Docker

on:
  push:
    branches: ["**"]
    tags: ["**"]

env:
  REGISTRY_IMAGE: shanisma/pnex-coolprop-rs

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # nothing here pushes to git; keep the token out of .git/config

      # Fail fast with a clear message instead of the cryptic
      # "Username and password required" from login-action. Push-triggered
      # runs always see repository secrets, so if this fires the names are
      # missing on THIS repo (other repo / environment / Variables tab).
      - name: Check Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            # Names only — GitHub masks all secret values automatically.
            NAMES=$(printf '%s' "$SECRETS_JSON" | python3 -c "import json,sys; print(', '.join(sorted(json.load(sys.stdin))))" 2>/dev/null || echo 'unavailable')
            VARNAMES=$(printf '%s' "$VARS_JSON" | python3 -c "import json,sys; print(', '.join(sorted(json.load(sys.stdin))))" 2>/dev/null || echo 'unavailable')
            echo "::error::Docker Hub credentials not visible. Secret names this run can see: [$NAMES]. Variable names: [$VARNAMES]. Need DOCKER_TOKEN as a repository secret, and DOCKER_USERNAME as a repository variable or secret, on Pnex/pnex-coolprop-rs (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # branch -> branch name, main also gets latest, git tag -> tag name
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Add linux/arm64 here for multi-arch (slower build under QEMU).
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
