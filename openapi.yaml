        in: query
        description: Temperature.
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Temperature in K
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
  /api/v1/misc/k2f:
    get:
      tags:
      - routes::info
      summary: Convert Kelvin to degrees Fahrenheit.
      description: Maps to the C function `K2F`.
      operationId: k2f
      parameters:
      - name: t
        in: query
        description: Temperature.
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Temperature in °F
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
  /api/v1/misc/saturation-ancillary:
    get:
      tags:
      - routes::info
      summary: |-
        Evaluate a saturation ancillary curve (fast, but less accurate than the
        full EOS).
      description: Maps to the C function `saturation_ancillary`.
      operationId: saturation_ancillary
      parameters:
      - name: fluid
        in: query
        description: Fluid name (Helmholtz-EOS backend only).
        required: true
        schema:
          type: string
      - name: output
        in: query
        description: Desired output of the ancillary, e.g. `"P"`.
        required: true
        schema:
          type: string
      - name: q
        in: query
        description: 'Quality: 0 (saturated liquid) or 1 (saturated vapor).'
        required: true
        schema:
          type: integer
          format: int32
      - name: input
        in: query
        description: Ancillary input variable, e.g. `"T"`.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Input value.
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Ancillary value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/params/global/{param}:
    get:
      tags:
      - routes::info
      summary: |-
        Query a global parameter string: `version`, `gitrevision`, `fluids_list`,
        `errstring`, `warnstring`, `FluidsList`, ...
      description: Maps to the C function `get_global_param_string`.
      operationId: get_global_param_string
      parameters:
      - name: param
        in: path
        description: Global parameter name, e.g. `version`
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Parameter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
        '400':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/params/index:
    get:
      tags:
      - routes::info
      summary: Integer index for a CoolProp parameter name (for keyed outputs).
      description: Maps to the C function `get_param_index`.
      operationId: get_param_index
      parameters:
      - name: name
        in: query
        description: Parameter name, e.g. `"T"`, `"Dmolar"`, `"PT_INPUTS"`, ...
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Parameter index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexValue'
        '400':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/params/information/{param}:
    get:
      tags:
      - routes::info
      summary: |-
        Long description, units, or IO role of a CoolProp parameter, e.g. for
        `"T"` + `long` → `"Temperature [K]"`.
      description: Maps to the C function `get_parameter_information_string`.
      operationId: get_parameter_information_string
      parameters:
      - name: param
        in: path
        description: Parameter name, e.g. `Dmolar`
        required: true
        schema:
          type: string
      - name: info
        in: query
        description: |-
          Kind of information: `"long"` (description, default), `"short"`,
          `"units"`, or `"IO"`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Human-readable parameter information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
        '400':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/1si:
    post:
      tags:
      - routes::props
      summary: |-
        Compute a parameter that needs no state inputs (critical point data,
        molar mass, ...) for a fluid.
      description: Maps to the C function `Props1SI`.
      operationId: props_1si
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Props1SiRequest'
        required: true
      responses:
        '200':
          description: Property value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/1si-multi:
    post:
      tags:
      - routes::props
      summary: |-
        Vectorized `Props1SI` over several fluids. Note that — exactly like the
        underlying C function — only the first result row is exposed.
      description: Maps to the C function `Props1SImulti`.
      operationId: props_1si_multi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Props1SiMultiRequest'
        required: true
      responses:
        '200':
          description: Result values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/legacy:
    post:
      tags:
      - routes::props
      summary: Deprecated legacy property call, KSI unit system, char input names.
      description: Maps to the C function `Props`.
      operationId: props_legacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropsLegacyRequest'
        required: true
      responses:
        '200':
          description: Property value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/legacy-s:
    post:
      tags:
      - routes::props
      summary: Deprecated legacy property call with string input names (KSI units).
      description: Maps to the C function `PropsS`.
      operationId: props_legacy_s
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropsLegacyRequest'
        required: true
      responses:
        '200':
          description: Property value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/legacy/1:
    post:
      tags:
      - routes::props
      summary: 'Deprecated legacy `Props1` (KSI units): single-state output for a fluid.'
      description: Maps to the C function `Props1`.
      operationId: props_legacy_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Props1SiRequest'
        required: true
      responses:
        '200':
          description: Property value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/phase:
    post:
      tags:
      - routes::props
      summary: |-
        Phase at a given state point, e.g. `"liquid"`, `"gas"`, `"twophase"`,
        `"supercritical"`, ...
      description: Maps to the C function `PhaseSI`.
      operationId: phase_si
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropsSiRequest'
        required: true
      responses:
        '200':
          description: Phase name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/si:
    post:
      tags:
      - routes::props
      summary: Compute a thermophysical property (SI units) at a single state point.
      description: Maps to the C function `PropsSI`.
      operationId: props_si
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropsSiRequest'
        required: true
      responses:
        '200':
          description: Property value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/props/si-multi:
    post:
      tags:
      - routes::props
      summary: |-
        Vectorized `PropsSI`: compute one or more outputs over arrays of input
        values. Returns a matrix with one row per input point and one column per
        requested output.
      description: Maps to the C function `PropsSImulti`.
      operationId: props_si_multi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropsSiMultiRequest'
        required: true
      responses:
        '200':
          description: Result matrix (rows = input points, columns = outputs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health:
    get:
      tags: []
      summary: Liveness probe.
      operationId: health
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    Ack:
      type: object
      description: Simple acknowledgement for mutating calls.
      required:
      - success
      properties:
        success:
          type: boolean
    AddFluidsRequest:
      type: object
      required:
      - backend
      - fluid_string
      properties:
        backend:
          type: string
          description: Backend to add the fluids to, e.g. `"HEOS"`, `"SRK"`, `"PR"`.
        fluid_string:
          type: string
          description: JSON-formatted fluid definition string.
    ArrayValue:
      type: object
      description: 1-D result array.
      required:
      - values
      properties:
        values:
          type: array
          items:
            type: number
            format: double
    BackendFluid:
      type: object
      required:
      - backend
      - fluid
      properties:
        backend:
          type: string
          description: Backend part (`"HEOS"`, `"REFPROP"`, ...; empty when not prefixed).
        fluid:
          type: string
          description: Fluid part, e.g. `"Water[0.5]&Ethane[0.5]"`.
    BinaryInteractionRequest:
      type: object
      required:
      - i
      - j
      - parameter
      - value
      properties:
        i:
          type: integer
          format: int64
          description: Index of the first fluid of the binary pair.
        j:
          type: integer
          format: int64
          description: Index of the second fluid of the binary pair.
        parameter:
          type: string
          description: Parameter name, e.g. `"betaT"`, `"gammaT"`.
        value:
          type: number
          format: double
    BuildPhaseEnvelopeRequest:
      type: object
      properties:
        level:
          type:
          - string
          - 'null'
          description: 'Refinement level: `"none"` (recommended) or a higher level string.'
    CairSatRequest:
      type: object
      required:
      - t
      properties:
        t:
          type: number
          format: double
          description: Temperature in K (valid range 250–300 K, no bound checking).
    CommonOutResponse:
      type: object
      required:
      - t
      - p
      - rhomolar
      - hmolar
      - smolar
      properties:
        hmolar:
          type: array
          items:
            type: number
            format: double
        p:
          type: array
          items:
            type: number
            format: double
        rhomolar:
          type: array
          items:
            type: number
            format: double
        smolar:
          type: array
          items:
            type: number
            format: double
        t:
          type: array
          items:
            type: number
            format: double
    CreateRequest:
      type: object
      required:
      - backend
      - fluids
      properties:
        backend:
          type: string
          description: 'Backend: `"HEOS"`, `"REFPROP"`, `"INCOMP"`, `"SRK"`, `"PR"` ...'
        fluids:
          type: array
          items:
            type: string
          description: Fluids of the mixture, one entry per component.
    CriticalPointDto:
      type: object
      required:
      - t
      - p
      - rhomolar
      - stable
      properties:
        p:
          type: number
          format: double
        rhomolar:
          type: number
          format: double
        stable:
          type: boolean
        t:
          type: number
          format: double
    CriticalPointsResponse:
      type: object
      required:
      - points
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/CriticalPointDto'
    CubicAlphaCRequest:
      type: object
      required:
      - i
      - parameter
      - c1
      - c2
      - c3
      properties:
        c1:
          type: number
          format: double
        c2:
          type: number
          format: double
        c3:
          type: number
          format: double
        i:
          type: integer
          format: int64
          description: Index of the fluid the parameters apply to.
        parameter:
          type: string
          description: Alpha function name, e.g. `"TWU"`.
    DebugLevelRequest:
      type: object
      required:
      - level
      properties:
        level:
          type: integer
          format: int32
          description: Verbosity level for CoolProp debugging output (0–10).
    DoubleValue:
      type: object
      description: Single scalar result.
      required:
      - value
      properties:
        value:
          type: number
          format: double
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ExtractBackendRequest:
      type: object
      required:
      - fluid_string
      properties:
        fluid_string:
          type: string
          description: Fluid string, e.g. `"REFPROP::Water[0.5]&Ethane[0.5]"`.
    FirstPartialDerivRequest:
      type: object
      required:
      - of
      - wrt
      - constant
      properties:
        constant:
          $ref: '#/components/schemas/Param'
          description: Parameter held constant.
        of:
          $ref: '#/components/schemas/Param'
        wrt:
          $ref: '#/components/schemas/Param'
    FirstSaturationDerivRequest:
      type: object
      required:
      - of
      - wrt
      properties:
        of:
          $ref: '#/components/schemas/Param'
          description: Parameter being differentiated (name or index).
        wrt:
          $ref: '#/components/schemas/Param'
          description: Parameter the derivative is taken with respect to.
    FirstTwoPhaseDerivRequest:
      type: object
      required:
      - of
      - wrt
      - constant
      properties:
        constant:
          $ref: '#/components/schemas/Param'
        of:
          $ref: '#/components/schemas/Param'
        wrt:
          $ref: '#/components/schemas/Param'
        x_end:
          type:
          - number
          - 'null'
          format: double
          description: Spline end fraction (0..1, usually 0.1) — splined variant only.
    FlagValue:
      type: object
      description: Boolean flag result.
      required:
      - value
      properties:
        value:
          type: boolean
    FluidParameterDoubleRequest:
      type: object
      required:
      - i
      - parameter
      - value
      properties:
        i:
          type: integer
          format: int64
          description: Index of the fluid the parameter applies to.
        parameter:
          type: string
          description: Parameter name, e.g. `"cm"` for volume translation.
        value:
          type: number
          format: double
    HaPropsRequest:
      type: object
      required:
      - output
      - name1
      - prop1
      - name2
      - prop2
      - name3
      - prop3
      properties:
        name1:
          type: string
          description: First input name, e.g. `"T"`.
        name2:
          type: string
          description: Second input name, e.g. `"P"`.
        name3:
          type: string
          description: Third input name, e.g. `"R"` (relative humidity) or `"W"`.
        output:
          type: string
          description: Output, e.g. `"H"`, `"W"`, `"R"`, `"T"`, `"V"`, ...
        prop1:
          type: number
          format: double
          description: First input value.
        prop2:
          type: number
          format: double
          description: Second input value.
        prop3:
          type: number
          format: double
          description: Third input value.
    HandleResponse:
      type: object
      required:
      - handle
      properties:
        handle:
          type: integer
          format: int64
          description: Handle for all subsequent calls.
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    IndexValue:
      type: object
      description: Single integer index result.
      required:
      - index
      properties:
        index:
          type: integer
          format: int64
    InputPair:
      oneOf:
      - type: string
        description: Input pair name, e.g. `"PT_INPUTS"`, `"PQ_INPUTS"`, `"QT_INPUTS"`, ...
      - type: integer
        format: int64
        description: Integer input pair index from `get_input_pair_index`.
      description: |-
        An AbstractState input pair, addressable either by name (`"PT_INPUTS"`)
        or by its integer index (as returned by `get_input_pair_index`).
    KeyedOutputSatStateRequest:
      type: object
      required:
      - saturated_state
      - param
      properties:
        param:
          $ref: '#/components/schemas/Param'
          description: Parameter name or index.
        saturated_state:
          type: string
          description: '`"liquid"` or `"gas"`.'
    LengthValue:
      type: object
      description: Single length result.
      required:
      - length
      properties:
        length:
          type: integer
          format: int64
    MatrixValue:
      type: object
      description: |-
        2-D result matrix: `shape` is `[points, outputs]` — one row per input
        point, one column per requested output (mirrors CoolProp's own
        `PropsSImulti` layout).
      required:
      - shape
      - values
      properties:
        shape:
          type: array
          items:
            type: integer
            minimum: 0
        values:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: '`values[point][output]`.'
    Out1Response:
      type: object
      required:
      - out
      properties:
        out:
          type: array
          items:
            type: number
            format: double
    Out5Response:
      type: object
      required:
      - out1
      - out2
      - out3
      - out4
      - out5
      properties:
        out1:
          type: array
          items:
            type: number
            format: double
        out2:
          type: array
          items:
            type: number
            format: double
        out3:
          type: array
          items:
            type: number
            format: double
        out4:
          type: array
          items:
            type: number
            format: double
        out5:
          type: array
          items:
            type: number
            format: double
    Param:
      oneOf:
      - type: string
        description: Parameter name, e.g. `"T"`, `"P"`, `"Dmolar"`, `"Hmolar"`, ...
      - type: integer
        format: int64
        description: Integer parameter index from `get_param_index`.
      description: |-
        A CoolProp output parameter, addressable either by name (`"Dmolar"`) or by
        its integer index (as returned by `get_param_index`).
    PhaseEnvelopeResponse:
      type: object
      required:
      - length
      - components
      - t
      - p
      - rhomolar_vap
      - rhomolar_liq
      - x
      - y
      properties:
        components:
          type: integer
          description: Number of mixture components in `x`/`y`.
          minimum: 0
        length:
          type: integer
          description: Number of envelope points.
          minimum: 0
        p:
          type: array
          items:
            type: number
            format: double
        rhomolar_liq:
          type: array
          items:
            type: number
            format: double
        rhomolar_vap:
          type: array
          items:
            type: number
            format: double
        t:
          type: array
          items:
            type: number
            format: double
        x:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: 'Liquid composition per point: `x[point][component]`.'
        y:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: 'Vapor composition per point: `y[point][component]`.'
    PhaseRequest:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          description: 'Phase to impose: `"liquid"`, `"gas"`, `"supercritical"`, ...'
    PhaseResponse:
      type: object
      required:
      - phase_index
      - phase
      properties:
        phase:
          type: string
          description: |-
            Phase name, e.g. `"liquid"`, `"gas"`, `"twophase"`,
            `"supercritical"`, ...; `"phase_<index>"` for unmapped values.
        phase_index:
          type: integer
          format: int32
          description: Raw phase index from CoolProp (`iphase_*` enum).
    Props1SiMultiRequest:
      type: object
      required:
      - outputs
      - fluids
      properties:
        backend:
          type:
          - string
          - 'null'
          description: Backend (`"HEOS"`, `"REFPROP"`, ...). Defaults to `"HEOS"`.
        fluids:
          type: array
          items:
            type: string
          description: Fluid names (one per component).
        fractions:
          type: array
          items:
            type: number
            format: double
          description: Molar fractions, one per fluid. Defaults to an equal split.
        outputs:
          type: array
          items:
            type: string
          description: Output parameter names.
    Props1SiRequest:
      type: object
      required:
      - fluid
      - output
      properties:
        fluid:
          type: string
          description: Fluid name, e.g. `"Water"` or `"HEOS::R134a"`.
        output:
          type: string
          description: |-
            Output that requires no state inputs, e.g. `"Tcrit"`, `"Pcrit"`,
            `"molar_mass"`, `"aliases"`, ...
    PropsLegacyRequest:
      type: object
      required:
      - output
      - name1
      - prop1
      - name2
      - prop2
      - ref
      properties:
        name1:
          type: string
          description: |-
            Single-character input name (e.g. `"T"`) — the legacy API only
            accepts one character here.
        name2:
          type: string
        output:
          type: string
        prop1:
          type: number
          format: double
        prop2:
          type: number
          format: double
        ref:
          type: string
          description: Fluid / reference string.
    PropsSiMultiRequest:
      type: object
      required:
      - outputs
      - name1
      - prop1
      - name2
      - prop2
      - fluids
      properties:
        backend:
          type:
          - string
          - 'null'
          description: Backend (`"HEOS"`, `"REFPROP"`, ...). Defaults to `"HEOS"`.
        fluids:
          type: array
          items:
            type: string
          description: Fluid names (one per component).
        fractions:
          type: array
          items:
            type: number
            format: double
          description: Molar fractions, one per fluid. Defaults to an equal split.
        name1:
          type: string
          description: Name of the first input variable.
        name2:
          type: string
          description: Name of the second input variable.
        outputs:
          type: array
          items:
            type: string
          description: Output parameter names; one column of the result per output.
        prop1:
          type: array
          items:
            type: number
            format: double
          description: Values of the first input variable.
        prop2:
          type: array
          items:
            type: number
            format: double
          description: Values of the second input variable (same length as `prop1`).
    PropsSiRequest:
      type: object
      required:
      - output
      - name1
      - prop1
      - name2
      - prop2
      - fluid
      properties:
        fluid:
          type: string
          description: |-
            Fluid string, e.g. `"Propane[0.5]&Ethane[0.5]"`, `"HEOS::Water"`,
            `"REFPROP::R134a"` (backend prefix optional, default `HEOS`).
        name1:
          type: string
          description: Name of the first input, e.g. `"T"`.
        name2:
          type: string
          description: Name of the second input, e.g. `"P"`.
        output:
          type: string
          description: Output parameter name, e.g. `"Dmolar"`, `"Hmolar"`, `"T"`, ...
        prop1:
          type: number
          format: double
          description: Value of the first input.
        prop2:
          type: number
          format: double
          description: Value of the second input.
    RedirectStdoutRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          description: |-
            File path to append stdout to (process-global). Use `/dev/stdout` on
            Linux to restore the original stream.
    SecondPartialDerivRequest:
      type: object
      required:
      - of1
      - wrt1
      - constant1
      - wrt2
      - constant2
      properties:
        constant1:
          $ref: '#/components/schemas/Param'
        constant2:
          $ref: '#/components/schemas/Param'
        of1:
          $ref: '#/components/schemas/Param'
        wrt1:
          $ref: '#/components/schemas/Param'
        wrt2:
          $ref: '#/components/schemas/Param'
    SetConfigBoolRequest:
      type: object
      required:
      - key
      - val
      properties:
        key:
          type: string
          description: Configuration key, e.g. `"SUPERANCILLARY"`.
        val:
          type: boolean
    SetConfigDoubleRequest:
      type: object
      required:
      - key
      - val
      properties:
        key:
          type: string
          description: Configuration key, e.g. `"RHOL_TO_RHOMASS_MAX_RATIO"`.
        val:
          type: number
          format: double
    SetConfigStringRequest:
      type: object
      required:
      - key
      - val
      properties:
        key:
          type: string
          description: Configuration key, e.g. `"VTPR_BACKEND"`.
        val:
          type: string
    SetDepartureFunctionsRequest:
      type: object
      required:
      - string_data
      properties:
        string_data:
          type: string
          description: |-
            Departure functions as a JSON string, or the contents of a REFPROP
            HMX.BNC file.
    SetFractionsRequest:
      type: object
      required:
      - fractions
      properties:
        fractions:
          type: array
          items:
            type: number
            format: double
          description: Fractions (molar by default; mass/volume depending on backend use).
    SetReferenceStateDRequest:
      type: object
      required:
      - fluid
      - t
      - rhomolar
      - hmolar0
      - smolar0
      properties:
        fluid:
          type: string
          description: Fluid name.
        hmolar0:
          type: number
          format: double
          description: Molar enthalpy at the new reference state [J/mol].
        rhomolar:
          type: number
          format: double
          description: Molar density [mol/m³].
        smolar0:
          type: number
          format: double
          description: Molar entropy at the new reference state [J/mol/K].
        t:
          type: number
          format: double
          description: Temperature [K].
    SetReferenceStateSRequest:
      type: object
      required:
      - fluid
      - reference_state
      properties:
        fluid:
          type: string
          description: Fluid name.
        reference_state:
          type: string
          description: 'Named reference state: `"IIR"`, `"ASHRAE"`, `"NBP"`, `"DEF"`, `"RESET"`.'
    SpinodalResponse:
      type: object
      required:
      - tau
      - delta
      - m1
      properties:
        delta:
          type: array
          items:
            type: number
            format: double
        m1:
          type: array
          items:
            type: number
            format: double
        tau:
          type: array
          items:
            type: number
            format: double
    StringArrayValue:
      type: object
      description: 1-D string array result.
      required:
      - values
      properties:
        values:
          type: array
          items:
            type: string
    StringValue:
      type: object
      description: Single string result.
      required:
      - value
      properties:
        value:
          type: string
    UpdateAndOutRequest:
      type: object
      required:
      - input_pair
      - value1
      - value2
      properties:
        input_pair:
          $ref: '#/components/schemas/InputPair'
        output:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Param'
            description: Single output parameter (update-and-1-out variant).
        outputs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Param'
          description: Exactly five output parameters (update-and-5-out variant).
        value1:
          type: array
          items:
            type: number
            format: double
        value2:
          type: array
          items:
            type: number
            format: double
    UpdateRequest:
      type: object
      required:
      - input_pair
      - value1
      - value2
      properties:
        input_pair:
          $ref: '#/components/schemas/InputPair'
          description: Input pair (name or index), e.g. `"PT_INPUTS"`.
        value1:
          type: number
          format: double
          description: First input value (e.g. pressure [Pa] for `PT_INPUTS`).
        value2:
          type: number
          format: double
          description: Second input value (e.g. temperature [K] for `PT_INPUTS`).
