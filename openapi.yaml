openapi: 3.1.0
info:
  title: CoolProp Server
  description: REST API wrapping the complete C API of CoolProp v8.0.0 (thermophysical properties of pure fluids, mixtures and humid air). Every one of the 71 functions exported by CoolPropLib.h is exposed by exactly one endpoint — see the `coverage` module for the mapping.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /api/v1/abstract-state:
    post:
      tags:
      - routes::abstract_state
      summary: Create an AbstractState and return its handle.
      description: Maps to the C function `AbstractState_factory`.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: Handle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleResponse'
        '400':
          description: CoolProp rejected backend/fluids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}:
    delete:
      tags:
      - routes::abstract_state
      summary: Release an AbstractState. Subsequent calls with this handle return 404.
      description: Maps to the C function `AbstractState_free`.
      operationId: free
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: State released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/all-critical-points:
    get:
      tags:
      - routes::abstract_state
      summary: |-
        All critical points for the current composition. The C API reports no
        actual count; unfilled entries are trimmed heuristically.
      description: Maps to the C function `AbstractState_all_critical_points`.
      operationId: all_critical_points
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: max_points
        in: query
        description: Buffer capacity for points (default 10).
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      responses:
        '200':
          description: Critical points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriticalPointsResponse'
        '400':
          description: Buffer too small
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/backend-name:
    get:
      tags:
      - routes::abstract_state
      summary: Name of the backend used by this AbstractState.
      description: Maps to the C function `AbstractState_backend_name`.
      operationId: backend_name
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Backend name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/binary-interaction:
    post:
      tags:
      - routes::abstract_state
      summary: Set a binary interaction parameter of a mixture.
      description: Maps to the C function `AbstractState_set_binary_interaction_double`.
      operationId: set_binary_interaction
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BinaryInteractionRequest'
        required: true
      responses:
        '200':
          description: Parameter set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/cubic-alpha-c:
    post:
      tags:
      - routes::abstract_state
      summary: Set cubic alpha function parameters (cubic EOS backends).
      description: Maps to the C function `AbstractState_set_cubic_alpha_C`.
      operationId: set_cubic_alpha_c
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CubicAlphaCRequest'
        required: true
      responses:
        '200':
          description: Parameters set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/first-partial-deriv:
    post:
      tags:
      - routes::abstract_state
      summary: First partial derivative `(∂Of/∂Wrt)|Constant` in homogeneous phases.
      description: Maps to the C function `AbstractState_first_partial_deriv`.
      operationId: first_partial_deriv
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstPartialDerivRequest'
        required: true
      responses:
        '200':
          description: Derivative value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/first-saturation-deriv:
    post:
      tags:
      - routes::abstract_state
      summary: Saturation derivative `(∂Of/∂Wrt)|sat` — valid in the two-phase region.
      description: Maps to the C function `AbstractState_first_saturation_deriv`.
      operationId: first_saturation_deriv
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstSaturationDerivRequest'
        required: true
      responses:
        '200':
          description: Derivative value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/first-two-phase-deriv:
    post:
      tags:
      - routes::abstract_state
      summary: First derivative in the two-phase region.
      description: Maps to the C function `AbstractState_first_two_phase_deriv`.
      operationId: first_two_phase_deriv
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstTwoPhaseDerivRequest'
        required: true
      responses:
        '200':
          description: Derivative value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/first-two-phase-deriv-splined:
    post:
      tags:
      - routes::abstract_state
      summary: First two-phase derivative using the spline approach of Quoilin et al.
      description: Maps to the C function `AbstractState_first_two_phase_deriv_splined`.
      operationId: first_two_phase_deriv_splined
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstTwoPhaseDerivRequest'
        required: true
      responses:
        '200':
          description: Derivative value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/fluid-names:
    get:
      tags:
      - routes::abstract_state
      summary: Fluid names of this AbstractState.
      description: Maps to the C function `AbstractState_fluid_names`.
      operationId: fluid_names
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Fluid names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringArrayValue'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/fluid-param-string:
    get:
      tags:
      - routes::abstract_state
      summary: String metadata about the fluid(s) of this AbstractState.
      description: Maps to the C function `AbstractState_fluid_param_string`.
      operationId: fluid_param_string
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: param
        in: query
        description: Fluid parameter, e.g. `"pure"`, `"CAS"`, `"BibTeX-Key"` ...
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Parameter string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
        '400':
          description: CoolProp rejected the parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/fluid-parameter-double:
    post:
      tags:
      - routes::abstract_state
      summary: Set a numeric fluid parameter (e.g. volume translation in cubic backends).
      description: Maps to the C function `AbstractState_set_fluid_parameter_double`.
      operationId: set_fluid_parameter_double
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FluidParameterDoubleRequest'
        required: true
      responses:
        '200':
          description: Parameter set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/fractions:
    post:
      tags:
      - routes::abstract_state
      summary: Set the fractions of the mixture components.
      description: Maps to the C function `AbstractState_set_fractions`.
      operationId: set_fractions
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFractionsRequest'
        required: true
      responses:
        '200':
          description: Fractions set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400':
          description: CoolProp rejected the fractions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/fugacity-coefficient/{i}:
    get:
      tags:
      - routes::abstract_state
      summary: Fugacity coefficient of the i-th mixture component.
      description: Maps to the C function `AbstractState_get_fugacity_coefficient`.
      operationId: get_fugacity_coefficient
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: i
        in: path
        description: Component index
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Fugacity coefficient [-]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/fugacity/{i}:
    get:
      tags:
      - routes::abstract_state
      summary: Fugacity of the i-th mixture component.
      description: Maps to the C function `AbstractState_get_fugacity`.
      operationId: get_fugacity
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: i
        in: path
        description: Component index
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Fugacity [Pa]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/keyed-output/sat-state:
    post:
      tags:
      - routes::abstract_state
      summary: Keyed output for the saturated liquid or vapor state (two-phase region).
      description: Maps to the C function `AbstractState_keyed_output_satState`.
      operationId: keyed_output_sat_state
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyedOutputSatStateRequest'
        required: true
      responses:
        '200':
          description: Output value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/keyed-output/{param}:
    get:
      tags:
      - routes::abstract_state
      summary: Get an output value by parameter name or index.
      description: Maps to the C function `AbstractState_keyed_output`.
      operationId: keyed_output
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: param
        in: path
        description: Parameter name (e.g. `Dmolar`) or numeric index
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Output value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/mole-fractions:
    get:
      tags:
      - routes::abstract_state
      summary: Get the mole fractions of the mixture.
      description: Maps to the C function `AbstractState_get_mole_fractions`.
      operationId: get_mole_fractions
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Mole fractions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayValue'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/mole-fractions/sat-state:
    get:
      tags:
      - routes::abstract_state
      summary: |-
        Get the mole fractions in the saturated liquid or vapor phase; only valid
        in the two-phase region.
      description: Maps to the C function `AbstractState_get_mole_fractions_satState`.
      operationId: get_mole_fractions_sat_state
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: saturated_state
        in: query
        description: '`"liquid"` or `"gas"`.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saturated-state mole fractions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayValue'
        '400':
          description: State is not two-phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/phase:
    get:
      tags:
      - routes::abstract_state
      summary: Phase index/name of the current state.
      description: Maps to the C function `AbstractState_phase`.
      operationId: phase
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseResponse'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/phase-envelope:
    get:
      tags:
      - routes::abstract_state
      summary: 'Get phase envelope data (checked-memory variant: reports actual sizes).'
      description: Maps to the C function `AbstractState_get_phase_envelope_data_checkedMemory`.
      operationId: get_phase_envelope
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: max_length
        in: query
        description: Buffer capacity for points (default 10000).
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      - name: max_components
        in: query
        description: Buffer capacity for components (default 20).
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      responses:
        '200':
          description: Phase envelope data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseEnvelopeResponse'
        '400':
          description: Buffer too small or envelope not built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/phase-envelope/build:
    post:
      tags:
      - routes::abstract_state
      summary: Build the phase envelope for the current mixture composition.
      description: Maps to the C function `AbstractState_build_phase_envelope`.
      operationId: build_phase_envelope
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildPhaseEnvelopeRequest'
        required: true
      responses:
        '200':
          description: Envelope built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400':
          description: CoolProp rejected the input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/phase-envelope/raw:
    get:
      tags:
      - routes::abstract_state
      summary: |-
        Get phase envelope data — raw variant: returns exactly `length` points
        with no report of the actual size (faithful to the C semantics).
      description: Maps to the C function `AbstractState_get_phase_envelope_data`.
      operationId: get_phase_envelope_raw
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: max_length
        in: query
        description: Buffer capacity for points (default 10000).
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      - name: max_components
        in: query
        description: Buffer capacity for components (default 20).
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      responses:
        '200':
          description: Phase envelope data (fixed length)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseEnvelopeResponse'
        '400':
          description: Buffer too small or envelope not built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/saturated-liquid-output/{param}:
    get:
      tags:
      - routes::abstract_state
      summary: Keyed output of the saturated liquid state (two-phase region).
      description: Maps to the C function `AbstractState_saturated_liquid_keyed_output`.
      operationId: saturated_liquid_keyed_output
      parameters:
      - name: handle
        in: path
        description: AbstractState handle
        required: true
        schema:
          type: integer
          format: int64
      - name: param
        in: path
        description: Parameter name or numeric index
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Output value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubleValue'
        '400':
          description: CoolProp rejected the parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/abstract-state/{handle}/saturated-vapor-output/{param}:
    get:
      tags:
      - routes::abstract_state
      summary: Keyed output of the saturated vapor state (two-phase region).
      description: Maps to the C function `AbstractState_saturated_vapor_keyed_output`.
      operationId: saturated_vapor_keyed_output
      parameters:
      - name: handle
        in: path
